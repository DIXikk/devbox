<!doctype html>
<!-- GitHub social preview (Settings → Social preview), 1280×640. Render: bun run tools/demo/social-preview.mjs -->
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:#141210;font-family:-apple-system,"Inter","Helvetica Neue",Arial,sans-serif}
  .wrap{position:absolute;inset:0;display:flex}
  .left{width:520px;padding:72px 0 0 72px;box-sizing:border-box}
  .logo{width:104px;height:104px}
  h1{color:#f5efe6;font-size:76px;letter-spacing:-2px;margin:30px 0 14px;font-weight:700}
  p{color:#c9bfb1;font-size:28px;line-height:1.35;margin:0;max-width:420px}
  .chips{margin-top:34px;display:flex;gap:10px;flex-wrap:wrap;max-width:430px}
  .chip{color:#ecb04f;border:1.5px solid #5a4523;border-radius:999px;padding:6px 14px;font-size:20px}
  .shot{position:absolute;left:560px;top:70px;width:900px;border-radius:14px;border:1px solid #3a332a;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,18,16,0) 70%,#141210 100%);pointer-events:none}
</style></head><body><div class="wrap">
  <div class="left">
    <img class="logo" src="../../docs/assets/logo.svg">
    <h1>devbox</h1>
    <p>Your own remote dev environment for AI coding agents.</p>
    <div class="chips"><span class="chip">Claude Code</span><span class="chip">Codex</span><span class="chip">Grok</span><span class="chip">self-hosted</span></div>
  </div>
  <img class="shot" src="../../docs/assets/dashboard-sessions.png">
  <div class="fade"></div>
</div></body></html>
